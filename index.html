<!DOCTYPE html>
<html>
<head>
    <title>R Heart Animation</title>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #ffe5eb, #ffd1dc 40%, #f9c2d1 100%);
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #heart-link {
            position: absolute;
            width: 700px;
            height: 600px;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        #heart {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .r {
            position: absolute;
            color: #d8004d;
            font-size: 20px;
            font-weight: bold;

            /* Small glow - letters stay visible */
            text-shadow: 0 0 8px rgba(216, 0, 77, 0.55);

            opacity: 0;
            animation: appear 0.3s forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Floating heart petals */

        .petal {
            position: absolute;
            bottom: -30px;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #ff7faa, #ff2d6c);
            border-radius: 50% 50% 0 0;
            transform: rotate(-45deg);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
            animation: float 7s ease forwards;
        }

        .petal::before,
        .petal::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            background: inherit;
            border-radius: 50%;
        }

        .petal::before {
            top: -11px;
            left: 0;
        }

        .petal::after {
            top: 0;
            left: 11px;
        }

        @keyframes float {
            0% {
                bottom: -30px;
                opacity: 0;
                transform: translateX(0) rotate(-45deg) scale(0.8);
            }

            10% {
                opacity: 1;
            }

            35% {
                transform: translateX(8px) rotate(-45deg) scale(1);
            }

            65% {
                transform: translateX(-8px) rotate(-45deg) scale(1);
            }

            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(4px) rotate(-45deg) scale(0.95);
            }
        }
    </style>
</head>

<body>

<a id="heart-link" href="https://example.com" target="_blank" rel="noreferrer noopener">
    <div id="heart"></div>
</a>

<script>

    let heart = document.getElementById("heart");
    let heartLink = document.getElementById("heart-link");

    heartLink.title = "Click to visit";

    /*
        Heart shape coordinates
    */

    let points = [];

    for (let t = 0; t < Math.PI * 2; t += 0.045) {

        let x = 16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        points.push({
            x: 350 + x * 15,
            y: 300 - y * 15
        });
    }

    /*
        Create R letters
        with enough space between them
    */

    let delay = 0;

    points.forEach(function(point) {

        let letter = document.createElement("span");

        letter.className = "r";

        letter.innerHTML = "R";

        letter.style.left = point.x + "px";
        letter.style.top = point.y + "px";

        letter.style.animationDelay = delay + "s";

        heart.appendChild(letter);

        delay += 0.045;
    });

    /*
        After the heart is completed,
        release balloons.
    */

    const delayStep = 0.045;
    let heartTime = delay * 1000 + 500;

    setTimeout(function() {
        createPetals();
    }, heartTime);

    function createPetals() {

        let petalCount = 20;

        for (let i = 0; i < petalCount; i++) {

            setTimeout(function() {

                let petal = document.createElement("div");
                petal.className = "petal";

                petal.style.left = 10 + Math.random() * 80 + "%";
                const size = 16 + Math.random() * 18;
                petal.style.width = size + "px";
                petal.style.height = size + "px";
                petal.style.animationDuration = 5 + Math.random() * 4 + "s";
                petal.style.opacity = 0;
                petal.style.filter = `blur(${Math.random() * 0.5}px)`;

                document.body.appendChild(petal);

                setTimeout(function() {
                    petal.remove();
                }, (parseFloat(petal.style.animationDuration) + 1) * 1000);

            }, i * 220);
        }
    }

</script>

</body>
</html>
